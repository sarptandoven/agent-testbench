# Recipe trading-backtest: a strategy up the ladder - a backtest with costs, look-ahead, walk-forward, the holdout once.
#
# Proves: backtest - on every row before the seal, testbench's own numbers (computed from the standard files the
#   backtest writes, never from what it prints) clear your bar, with fees or slippage charged, 30+ round trips and a
#   better total return than buy and hold; lookahead - no decision changes when the rows after it are cut away (the
#   steps rerun 4 times on the data cut earlier); walk-forward - every test window holds up on its own, each seeing only
#   the rows before its end; holdout - once, by the same rules, on the sealed rows no other plan ever saw: a second
#   opening is refused. testbench is not investment advice and picks no strategy: it checks the claims a backtest makes
#   (docs/trading-safely.md). For a strategy that will trade, add the alpaca-paper recipe's paper rung.
# FILL IN: the prices file and the day its sealed holdout starts, the backtest command, the bar its numbers must clear,
#   the walk-forward windows, and what each window and the holdout must at least do.
# Expects backtest.py (any framework, or plain pandas) to read the prices from TESTBENCH_DATA_PRICES - the copy holding
#   only the rows the plan may see - to trade from TESTBENCH_TEST_START (a walk-forward window's test period) or
#   TRADE_FROM when set, with the rows before for its indicators, and to write out/equity.csv (with a benchmark
#   column: buy and hold's price or equity) and out/trades.csv in testbench's standard format
#   (docs/trading.md#the-files; agent_testbench.trading.files has the writers), and out/signals.csv, one row per
#   decision: time, symbol, then a column per decision. Write the signal's number, not only the position it gives:
#   a number changes on every peek ahead, a 0 or 1 only when it flips. examples/trading/strategy.py is one.
# Costs: nothing; every plan runs on this machine. A walk-forward plan runs its steps once per window and a look-ahead
#   plan 1 + cuts times: `testbench plans` shows each count once the data is there.

data:
  prices:
    path: data/prices.csv                  # FILL IN: your prices: a time column (ISO dates or times), symbol, close
    holdout_from: 2025-07-01               # FILL IN: rows from here on are sealed: only the holdout plan sees them

plans:
  backtest:
    backend: local
    description: every row before the seal, graded by testbench - costs, 30+ round trips, beats buy and hold
    steps:
      - name: backtest
        run: python backtest.py            # FILL IN: your backtest (it writes out/equity.csv, trades.csv, signals.csv)
        max_minutes: 10
        artifacts: [out/equity.csv, out/trades.csv]     # evidence: the report's Strategy section and the tear sheet
        expect:
          strategy:
            equity: out/equity.csv         # trades.csv is read next to it
            sharpe: ">= 1"                 # FILL IN: the bar - on testbench's numbers, set before you look
            max_drawdown: ">= -0.25"       # FILL IN: the deepest fall you would sit through
            beats: buy_and_hold
            min_trades: 30
            costs: required                # a backtest that charged nothing fails: fees or slippage in trades.csv

  lookahead:
    backend: local
    description: the backtest, then 4 reruns on data cut earlier - a decision that changes used the future
    lookahead: {data: prices, output: out/signals.csv, cuts: 4}
    steps:
      - name: backtest
        run: python backtest.py            # FILL IN: the same command as backtest's
        max_minutes: 10
        expect:
          files: [out/signals.csv]         # what it decided: compared across the reruns

  walk-forward:
    backend: local
    description: window by window - 24 months of history, then the 6 months it trades; every window must hold up
    walk_forward: {data: prices, train: 24mo, test: 6mo}    # FILL IN: your windows
    # a strategy that fits parameters fits them on TESTBENCH_TRAIN_START to _END, then trades from TESTBENCH_TEST_START
    steps:
      - name: backtest
        run: python backtest.py            # FILL IN: the same command
        max_minutes: 10
        expect:
          strategy:
            total_return: ">= -0.1"        # FILL IN: what any one window may lose at most
            max_drawdown: ">= -0.2"
            min_trades: 2                  # a window holds a few round trips; the whole history needs 30
            costs: required

  holdout:
    backend: local
    description: once, on the sealed rows, by rules written before it opens - a second opening is refused
    holdout: {max_opens: 1}
    steps:
      - name: backtest
        run: python backtest.py            # FILL IN: the same command
        env: {TRADE_FROM: "2025-07-01"}    # FILL IN: holdout_from - it trades the sealed rows, the rest warm it up
        max_minutes: 10
        artifacts: [out/equity.csv, out/trades.csv]
        expect:
          strategy: {total_return: ">= -0.1", max_drawdown: ">= -0.2", min_trades: 2, costs: required}    # FILL IN: first
