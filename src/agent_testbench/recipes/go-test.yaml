# Recipe go-test: a Go module's tests - every package builds and every test passes, here and in a container offline.
#
# Proves: go-tests - every package built and every test passed in this run, counted from gotestsum's JUnit report
#   (written now; one left over from an earlier run fails): a failing test is named with its package and the line
#   that failed, a package that does not compile fails as `<package> > TestMain` and a panic as the test that
#   panicked; and at least as many tests ran as you have, so `./...` matching nothing fails. go-sandbox - the same in
#   a fresh container with no network.
# Why gotestsum: `go test` writes no JUnit itself. gotestsum runs `go test -json` and turns it into JUnit, and it is
#   the converter most Go projects' CI uses; it reports what a converter of your own would have to get right (build
#   failures, panics, subtests, skips) and prints go test's own summary to the log. `go run ...@v1.13.0` pins its
#   version in the plan and needs no install: the first run downloads it into Go's module cache.
# FILL IN: `tests: ">= N"` with the number of tests you have now (gotestsum's last line: `DONE N tests`; a subtest
#   counts, and so does its parent), the packages and flags (`-race`, `-tags integration`), and the image's tag.
#   `-count=1` makes go test run every test now instead of reporting a cached pass.
# Docker (go-sandbox): the container has no network, so Go, gotestsum, the modules go.mod needs and what testbench
#   itself runs in the container (Python with ipykernel, jupyter_client, nbformat, nbclient and pyyaml) go into an
#   image you build once, with the network on. The official golang image has no Python, so it starts from the
#   official Python image and copies Go from the official golang image. Save these lines without their leading "#"
#   and spaces as Dockerfile.testbench, then `docker build -f Dockerfile.testbench -t go-tests .`. With GOPROXY=off a
#   module the image lacks fails the build by name (`module lookup disabled by GOPROXY=off`): rebuild the image when
#   go.sum changes. In the container the plan runs the gotestsum the image installed: `go run ...@v1.13.0` asks the
#   module proxy whether the module is deprecated, even when it is in the cache, and offline that fails.
#     FROM golang:1.26-trixie AS go
#     FROM python:3.13-trixie
#     COPY --from=go /usr/local/go /usr/local/go
#     ENV PATH=/usr/local/go/bin:/root/go/bin:$PATH GOTOOLCHAIN=local
#     RUN pip install --no-cache-dir "nbformat>=5.9" "nbclient>=0.10" "ipykernel>=6.29" "jupyter_client>=8" "pyyaml>=6"
#     RUN go install gotest.tools/gotestsum@v1.13.0
#     COPY go.mod go.sum* /deps/
#     RUN cd /deps && go mod download && rm -rf /deps
#     ENV GOPROXY=off
# Costs: nothing; both run on this machine (usd_per_hour 0). The image build takes a few minutes, once.

# The container: the image built above as it is (setup: none), no network, hard limits on CPU and memory.
docker:
  image: go-tests                          # FILL IN: the tag you built Dockerfile.testbench as
  setup: none                              # it already has Go, gotestsum, the modules and testbench's basics
  network: none                            # only a loopback interface: nothing to download, nowhere to send
  cpu: 2
  memory_gb: 4
  usd_per_hour: 0.0

plans:
  go-tests:
    backend: local
    description: every package builds and every test passes, counted from gotestsum's JUnit report
    steps:
      - name: go test                      # FILL IN: your packages and flags, after the --
        run: go run gotest.tools/gotestsum@v1.13.0 --junitfile junit.xml -- -count=1 ./...
        max_minutes: 15
        artifacts: [junit.xml]
        expect:
          exit_code: 0                       # go test exits 1 when a test fails or a package does not build
          junit: {path: junit.xml, failures: 0, errors: 0, tests: ">= 1"}    # FILL IN: ">= N", the tests you have now
          duration: {minutes: "<= 10"}       # a suite that suddenly takes much longer is a finding too

  go-sandbox:
    backend: docker
    description: every package builds and every test passes in a fresh container with no network
    steps:
      - name: go test                      # FILL IN: your packages and flags, after the --
        run: gotestsum --junitfile junit.xml -- -count=1 ./...     # the gotestsum the image installed
        max_minutes: 15
        artifacts: [junit.xml]
        expect:
          junit: {path: junit.xml, failures: 0, errors: 0, tests: ">= 1"}    # FILL IN: ">= N", the tests you have now
