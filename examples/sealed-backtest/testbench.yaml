# yaml-language-server: $schema=https://raw.githubusercontent.com/sarptandoven/agent-testbench/main/src/agent_testbench/schema/testbench.schema.json
# A strategy an agent found is a claim. Tune it on `backtest` and `walk-forward`, which never see the sealed last
# quarter; `lookahead` checks it never uses tomorrow's data today; `holdout` opens the quarter, once
# (docs/trading-data.md).
project: sealed-backtest
data:
  prices:
    path: data/prices.csv            # time,symbol,close - one row per weekday, 2020-01-01 to 2025-09-30
    holdout_from: 2025-07-01         # sealed: only the holdout plan sees these rows

plans:
  backtest:
    description: the strategy on every row before the seal
    steps:
      - name: backtest
        run: python backtest.py
        max_minutes: 2
      - name: metrics
        run: python -m agent_testbench.trading.metrics out/equity.csv out/trades.csv --out out/metrics.json
        max_minutes: 1
        artifacts: [out/metrics.json]
        expect:
          json:
            out/metrics.json: {bars: ">= 1000", trades: ">= 10", costs_modeled: true, max_drawdown: ">= -0.5"}

  walk-forward:
    description: the same strategy window by window - 2 years of history, then the 6 months it trades
    walk_forward: {data: prices, train: 24mo, test: 6mo}
    steps:
      - name: backtest
        run: python backtest.py
        max_minutes: 2
      - name: metrics
        run: python -m agent_testbench.trading.metrics out/equity.csv out/trades.csv --out out/metrics.json
        max_minutes: 1
        artifacts: [out/metrics.json]
        expect:
          json:
            out/metrics.json: {bars: ">= 100", max_drawdown: ">= -0.3"}

  lookahead:
    description: does any decision change when the future is cut away? Four reruns on data cut earlier
    lookahead: {data: prices, output: out/signals.csv, cuts: 4}
    steps:
      - name: backtest
        run: python backtest.py
        max_minutes: 2

  holdout:
    description: once, on the sealed last quarter - a second opening is refused
    holdout: {max_opens: 1}
    steps:
      - name: backtest
        run: python backtest.py
        env: {TRADE_FROM: "2025-07-01"}
        max_minutes: 2
      - name: metrics
        run: python -m agent_testbench.trading.metrics out/equity.csv out/trades.csv --out out/metrics.json
        max_minutes: 1
        artifacts: [out/metrics.json]
        expect:
          json:
            out/metrics.json: {bars: ">= 60", max_drawdown: ">= -0.3"}
