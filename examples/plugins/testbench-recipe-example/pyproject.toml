[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "testbench-recipe-example"
version = "0.1.0"
description = "An example agent-testbench plug-in: one recipe, cli-smoke, shipped as a YAML file"
requires-python = ">=3.10"
dependencies = ["agent-testbench"]

# The recipe's name = the package that holds cli-smoke.yaml
[project.entry-points."agent_testbench.recipes"]
cli-smoke = "testbench_recipe_example"

[tool.hatch.build.targets.wheel]
packages = ["testbench_recipe_example"]
