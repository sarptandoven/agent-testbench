# The documentation site: https://sarptandoven.github.io/agent-testbench/
# Build it:  pip install -r docs/requirements.txt && mkdocs build --strict   (or `mkdocs serve` to read it locally)
# The pages are the Markdown files of the repository; docs/hooks.py puts README.md's sections (after the home page's
# own landing screen) and sections of the other files into pages and points their GitHub links at the site.
site_name: agent-testbench
site_description: A test bench your coding agent operates - live kernels and proved runs on your machine, Docker, ssh, Modal GPUs or Colab, inside a budget.
site_url: https://sarptandoven.github.io/agent-testbench/
repo_url: https://github.com/sarptandoven/agent-testbench
repo_name: sarptandoven/agent-testbench
edit_uri: ""                          # pages are put together from several files, so an edit link would mislead
copyright: MIT License

docs_dir: docs
exclude_docs: |
  hooks.py
  assets/make_screenshots.py
  requirements.txt
  __pycache__/
watch:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
hooks:
  - docs/hooks.py

nav:                                  # a few sections a newcomer can scan; every page is in one of them
  - Start:
      - Home: index.md
      - Getting started: getting-started.md
      - A five-minute tour: tour.md
      - Why agent-testbench: why.md
      - Use cases: use-cases.md
      - Examples: examples.md
      - Recipes: recipes.md
      - "Demo: an agent improves a model": demo-loop.md
      - "Demo: a failing suite fixed in a Docker sandbox": demo-sandbox.md
      - "Demo: an agent fixes a planted bug": demo.md
  - Prove things:
      - Expectations: expectations.md
      - Notebooks: notebooks.md
      - Mock clients (LLMs, brokers): mocks.md
      - Rescue a notebook: rescue.md
      - Proof records: proof-records.md
      - "Share a run: a page, a badge": share.md
      - "Watch: rerun on change": watch.md
      - Live dashboard: dashboard.md
      - "Exports: MLflow, W&B, csv": export.md
  - Work with agents:
      - Other coding agents and MCP: clients.md
      - VS Code extension: vscode.md
      - Loops: loops.md
      - Notifications: notify.md
      - GitHub Action: github-action.md
      - "Other CI: GitLab, Azure, CircleCI, shell": ci.md
      - Python API and tools: python-api.md
  - Machines:
      - Backends: backends.md
      - Docker: docker.md
      - ssh: ssh.md
      - Kubernetes: kubernetes.md
  - Trading:
      - Trading with agents safely: trading-safely.md
      - Files and metrics: trading.md
      - "Sealed data: holdout, walk-forward, look-ahead": trading-data.md
      - Overfitting statistics: trading-stats.md
  - Plug-ins:
      - Plug-ins: plugins.md
      - "Architecture: core and plug-ins": architecture.md
  - Trust:
      - Threat model: threat-model.md
      - Check it yourself: verify.md
      - FAQ: faq.md
  - Reference:
      - testbench.yaml and commands: reference.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Publishing: publishing.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

# Any link or anchor that does not resolve fails `mkdocs build --strict`, as does a page left out of the nav.
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
