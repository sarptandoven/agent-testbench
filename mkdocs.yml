# The documentation site: https://sarptandoven.github.io/agent-testbench/
# Build it:  pip install -r docs/requirements.txt && mkdocs build --strict   (or `mkdocs serve` to read it locally)
# The pages are the Markdown files of the repository; docs/hooks.py puts README.md and sections of the other files
# into pages and points their GitHub links at the site.
site_name: agent-testbench
site_description: A test bench your coding agent operates - live kernels and proved runs on your machine, Docker, ssh, Modal GPUs or Colab, inside a budget.
site_url: https://sarptandoven.github.io/agent-testbench/
repo_url: https://github.com/sarptandoven/agent-testbench
repo_name: sarptandoven/agent-testbench
edit_uri: ""                          # pages are put together from several files, so an edit link would mislead
copyright: MIT License

docs_dir: docs
exclude_docs: |
  hooks.py
  requirements.txt
  __pycache__/
watch:
  - README.md
  - CHANGELOG.md
  - CONTRIBUTING.md
hooks:
  - docs/hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Recipes: recipes.md
  - Expectations: expectations.md
  - Backends:
      - Overview: backends.md
      - Docker: docker.md
      - ssh: ssh.md
      - Plugins: plugins.md
  - Loops: loops.md
  - Notifications: notify.md
  - Proof records: proof-records.md
  - CI: github-action.md
  - Reference: reference.md
  - Demos:
      - An agent improves a model: demo-loop.md
      - A failing suite fixed in a Docker sandbox: demo-sandbox.md
      - An agent fixes a planted bug: demo.md
  - Project:
      - Changelog: changelog.md
      - Contributing: contributing.md
      - Publishing: publishing.md

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

# Any link or anchor that does not resolve fails `mkdocs build --strict`, as does a page left out of the nav.
validation:
  omitted_files: warn
  not_found: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
