name: docs
# Builds the documentation site (mkdocs.yml) with --strict on every push and pull request, so a broken link, a
# missing anchor or a page left out of the nav fails the check. Pushes to main also deploy it to GitHub Pages,
# which needs the repository's Pages source set to "GitHub Actions" (Settings, Pages); see docs/publishing.md.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: install
        run: python -m pip install -r docs/requirements.txt
      - name: build
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"    # hides Material for MkDocs' end-of-life banner (docs/publishing.md)
      - name: upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write                    # create the Pages deployment
      id-token: write                 # prove it comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
