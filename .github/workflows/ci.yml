name: tests
on:
  push:
    branches: [main]           # other branches are tested through their pull request (one run per commit, not two)
  pull_request:
  workflow_dispatch:
concurrency:                   # a newer commit cancels the runs it replaces
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" scikit-learn==1.5.2 matplotlib==3.9.2
          python -m playwright install --with-deps chromium
      - name: tests
        # in parallel: a pytest-xdist worker per vCPU (-n auto counts physical cores, which can be half of them; the
        # tests mostly wait on processes they start); tests marked serial (Docker) still run one at a time. Windows
        # runs them one by one: there, tests side by side share one console, and the console break one test sends
        # to stop its processes is not yet shown to stay out of the others'.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then python -m pytest -q -p no:warnings
          else python -m pytest -q -p no:warnings -n logical; fi
        env:
          PYTHONUTF8: "1"           # Windows: in-process tests too (the CLI switches itself)
  vscode:
    # the VS Code extension (editors/vscode): type-check, compile, and its unit tests with node --test. No VS Code
    # is downloaded; the test against the real CLI skips here (no Python package installed in this job).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
      - name: type-check
        run: npm run typecheck
      - name: tests
        run: npm test
