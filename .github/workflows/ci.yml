name: tests
on:
  push:
    branches: [main]           # other branches are tested through their pull request (one run per commit, not two)
  pull_request:
  workflow_dispatch:
concurrency:                   # a newer commit cancels the runs it replaces
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" scikit-learn==1.5.2 matplotlib==3.9.2
          python -m playwright install --with-deps chromium
      - name: tests
        # in parallel: a pytest-xdist worker per vCPU (-n auto counts physical cores, which can be half of them; the
        # tests mostly wait on processes they start); tests marked serial (Docker) still run one at a time
        run: python -m pytest -q -p no:warnings -n logical
        env:
          PYTHONUTF8: "1"           # Windows: in-process tests too (the CLI switches itself)
